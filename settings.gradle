pluginManagement {
	repositories {
		mavenLocal()
		mavenCentral()
		google()
		gradlePluginPortal()
	}
}
dependencyResolutionManagement {
	repositories {
		mavenLocal()
		mavenCentral()
		google()
		maven {
			url 'https://oom-maven.sawahara.host'
			content {
				includeGroupAndSubgroups 'ren.shiror'
				includeGroupAndSubgroups 'sbs.fvvlang'
			}
		}
		gradlePluginPortal()
	}
}

rootProject.name = 'PureJoy FYL'

include ':fytxt:plugin'
include ':fytxt:bom'
include ':fytxt:runtime:core', ':fytxt:runtime:compose', ':fytxt:runtime:systxt'