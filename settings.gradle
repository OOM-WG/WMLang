pluginManagement {
	repositories {
		mavenLocal()
		google()
		mavenCentral()
		maven { url 'https://jitpack.io' }
		gradlePluginPortal()
	}
}

// noinspection GradleDynamicVersion
plugins {
	// noinspection AndroidGradlePluginVersion
	id 'com.android.library' version '8.12.0' apply false
	id 'org.jetbrains.kotlin.android' version '+' apply false
	id 'org.jetbrains.kotlin.plugin.compose' version '+' apply false
	// id 'org.jetbrains.kotlin.multiplatform' version '+' apply false
	id 'com.palantir.git-version' version '+' apply false
}

dependencyResolutionManagement {
	repositories {
		mavenLocal()
		google()
		mavenCentral()
		maven {
			url 'https://oom-maven.sawahara.host'
			content {
				includeGroupByRegex 'ren\\.shiror.*'
				includeGroupByRegex 'dev\\.oom-wg.*'
			}
		}
		gradlePluginPortal()
	}
}

rootProject.name = 'PureJoy MultiLang'

include ':base', ':compose', ':systxt', ':plugin'