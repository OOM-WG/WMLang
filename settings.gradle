pluginManagement {
	repositories {
		mavenLocal()
		mavenCentral()
		google()
		gradlePluginPortal()
	}
}

// noinspection GradleDynamicVersion
plugins {
	// noinspection AndroidGradlePluginVersion
	id 'com.android.kotlin.multiplatform.library' version '8.12.0' apply false
	id 'org.jetbrains.kotlin.multiplatform' version '+' apply false
	id 'org.jetbrains.kotlin.plugin.compose' version '+' apply false
	id 'org.jetbrains.compose' version '+' apply false
	id 'com.palantir.git-version' version '+' apply false
}

dependencyResolutionManagement {
	repositories {
		mavenLocal()
		mavenCentral()
		google()
		maven {
			url 'https://oom-maven.sawahara.host'
			content {
				includeGroupAndSubgroups 'ren.shiror'
				includeGroupAndSubgroups 'dev.oom-wg'
			}
		}
		gradlePluginPortal()
	}
}

rootProject.name = 'PureJoy FYL'

include ':fytxt:plugin', ':fytxt:runtime:common', ':fytxt:runtime:compose', ':fytxt:runtime:systxt'